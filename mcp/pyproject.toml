[project]
name = "mdtools-mcp"
version = "0.1.0"
description = "文档格式转换工具 MCP Server - 支持 PDF <-> Markdown <-> Word"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.10.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "python-docx>=1.1.0",
    "mcp>=1.0.0",
]

[project.scripts]
mdtools-mcp = "mdtools_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdtools_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]
